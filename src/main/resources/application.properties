spring.application.name=auditoria-dados
server.port=8080

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:audit_db}
spring.datasource.username=${DB_USER:audit_admin}
spring.datasource.password=${DB_PASSWORD:audit_password}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true